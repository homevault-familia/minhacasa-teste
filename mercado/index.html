<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>MinhaCasa™ · Mercado</title>
<link rel="icon" href="../icon.svg?v=2">
<link rel="apple-touch-icon" href="../icon-180.png?v=2">
<style>
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:#0f172a;-webkit-text-size-adjust:100%;overflow-x:clip}
button,input,select,textarea{font:inherit}
.topo{background:#0f172a;color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;position:sticky;top:0;z-index:5}
body.teste .topo{padding-top:calc(env(safe-area-inset-top) + 34px)}
.topo-l{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
.topo img{width:32px;height:32px;border-radius:8px}
.topo h1{font-size:17px;margin:0;flex:1}
.topo h1 small{display:block;font-size:12px;font-weight:500;color:#94a3b8}
.topo a.volta{color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}
.sair{background:transparent;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:7px 12px;cursor:pointer;min-height:36px}
.abas{display:flex;gap:2px;overflow-x:auto;max-width:900px;margin:10px auto 0;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;background:transparent;border:0;color:#94a3b8;font-weight:700;padding:11px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;min-height:44px}
.abas button.on{color:#fff;border-bottom-color:#60a5fa}
main{max-width:900px;margin:0 auto;padding:16px 14px 80px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.card h2{font-size:16px;margin:0 0 8px}
.nota{font-size:13.5px;color:#475569;line-height:1.5;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:12.5px;color:#64748b;font-weight:600}
.kpi.verde b{color:#15803d}.kpi.vermelho b{color:#dc2626}.kpi.azul b{color:#1d4ed8}
.btn{border:1.5px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:44px}
.btn.pri{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.btn.cheio{width:100%}
.grupo-btn{display:flex;gap:8px;flex-wrap:wrap}
input.in,select.in,textarea.in{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;color:#0f172a;min-height:44px}
textarea.in{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
label.lb{display:block;font-size:12.5px;font-weight:800;color:#475569;margin:12px 0 6px}
.erro{color:#b91c1c;font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
.vazio{color:#94a3b8;font-size:14px;padding:10px 0}
.linha{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f1f5f9}
.linha:first-child{border-top:0}
.linha .info{flex:1}
.linha .t{font-weight:700;font-size:15px;word-break:break-word}
.linha .s{font-size:12.5px;color:#64748b;line-height:1.5;margin-top:2px}
.valor{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid #e2e8f0;background:#f8fafc;border-radius:10px;padding:6px 9px;font-size:13px;cursor:pointer;text-align:left;min-height:40px;color:#0f172a}
.chip b{display:block;font-variant-numeric:tabular-nums}
.chip.melhor{background:#fef08a;border-color:#eab308}
.chip.falta{color:#94a3b8;border-style:dashed;background:#fff}
.selo{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;background:#e2e8f0;color:#334155}
.ns{display:inline-block;min-width:26px;text-align:center;border-radius:6px;font-weight:800;color:#fff;padding:2px 6px;font-size:13px}
.ns-a{background:#038141}.ns-b{background:#85bb2f}.ns-c{background:#fecb02;color:#111}.ns-d{background:#ee8100}.ns-e{background:#e63e11}
.y0{background:#e63e11}.y1{background:#ee8100}.y2{background:#85bb2f}.y3{background:#038141}
.mini{display:block;font-size:11.5px;font-weight:700;color:#64748b}.mini .in{margin-top:2px}
.grade3{align-items:end}
.item-rev{border-top:1px solid #f1f5f9;padding:12px 0}
.item-rev:first-of-type{border-top:0}
.item-rev .raw{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#64748b;margin-bottom:6px}
.grade3{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr) minmax(0,.8fr) auto;gap:6px;margin-top:6px;align-items:center}
.barra{display:grid;grid-template-columns:7.5em minmax(0,1fr) 5.5em;gap:8px;align-items:center;margin:6px 0}
.barra span{font-size:12.5px;color:#475569}
.barra .tr{background:#f1f5f9;border-radius:4px}
.barra i{display:block;height:10px;border-radius:4px;background:#60a5fa}
.barra.passou i{background:#dc2626}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.filtros button{border:1.5px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:38px;color:#0f172a}
.filtros button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.caixa{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid #94a3b8;background:#fff;color:#fff;font-weight:900;font-size:17px;cursor:pointer;padding:0}
.feito .caixa{background:#15803d;border-color:#15803d}
.feito .t{text-decoration:line-through;color:#94a3b8}
.mono{font-family:ui-monospace,Menlo,monospace}
.passos{margin:0;padding-left:20px;font-size:14px;line-height:1.6;color:#334155}
.login{max-width:380px;margin:12vh auto 0;padding:0 18px}
.login img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 12px}
.login h1{text-align:center;font-size:20px;margin:0 0 4px}
.login p{text-align:center;color:#64748b;font-size:13.5px;margin:0 0 18px}
.fundo{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.fundo.on{display:flex}
.folha{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
@media (min-width:700px){.fundo{align-items:center}.folha{border-radius:20px}}
.folha h3{margin:0 0 4px;font-size:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;display:none;max-width:90vw}
.carregando{text-align:center;color:#64748b;padding:40px 0}
a{color:#1d4ed8}
:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
@media (max-width:420px){.grade3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.grade3 select{grid-column:1/-1}}
</style>
</head>
<body>

<div id="v-login" class="login" style="display:none">
  <img src="../icon.svg?v=2" alt="">
  <h1>Mercado</h1>
  <p>MinhaCasa™ · área pessoal</p>
  <div class="card">
    <p class="nota">Administrador: entre com a sua conta Google. Só entra quem você liberar.</p>
    <button class="btn pri cheio" id="l-google">Entrar com o Google</button>
    <div class="erro" id="l-erro"></div>
  </div>
  <div class="card">
    <p class="nota">Família: entre com o e-mail e a senha do app MinhaCasa.</p>
    <label class="lb" for="l-email">E-mail</label><input class="in" id="l-email" type="email" autocomplete="username">
    <label class="lb" for="l-senha">Senha</label><input class="in" id="l-senha" type="password" autocomplete="current-password">
    <div class="erro" id="l-erro2"></div>
    <button class="btn cheio" id="l-entrar">Entrar com e-mail e senha</button>
  </div>
</div>

<div id="v-negado" class="login" style="display:none">
  <img src="../icon.svg?v=2" alt="">
  <h1>Sem acesso</h1>
  <p id="n-msg">Esta área é pessoal.</p>
  <div class="card" id="n-codbox" style="display:none"><label class="lb" style="margin-top:0">Seu código</label><div class="mono" id="n-cod" style="word-break:break-all;font-size:15px;background:#f1f5f9;border-radius:10px;padding:12px"></div>
  <button class="btn pri cheio" id="n-copiar" style="margin-top:10px">Enviar o código</button></div>
  <button class="btn cheio" id="n-sair">Sair e entrar com outra conta</button>
</div>

<div id="v-app" style="display:none">
  <div class="topo">
    <div class="topo-l">
      <img src="../icon.svg?v=2" alt="">
      <h1>Mercado<small id="p-quem"></small></h1>
      <a class="volta" href="../">MinhaCasa</a>
      <button class="sair" id="p-sair">Sair</button>
    </div>
    <nav class="abas" id="abas">
      <button data-aba="lista" class="on">Lista do mês</button>
      <button data-aba="recibo">Recibo</button>
      <button data-aba="precos">Preços</button>
      <button data-aba="saude">Saudável</button>
      <button data-aba="gastos">Gastos</button>
    </nav>
  </div>
  <main id="conteudo"><div class="carregando">Carregando…</div></main>
</div>

<div class="fundo" id="fundo"><div class="folha" id="folha"></div></div>
<div class="toast" id="toast"></div>

<script src="../config.js"></script>
<script src="leitor.js"></script>
<script src="mercado.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, onValue, update, remove, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
window.iniciarMercado({ initializeApp, getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, getDatabase, ref, onValue, update, remove, get });
</script>
</body>
</html>
