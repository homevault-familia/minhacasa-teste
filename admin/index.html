<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>MinhaCasa™ · Administração</title>
<link rel="icon" href="../icon.svg?v=2">
<link rel="apple-touch-icon" href="../icon-180.png?v=2">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:#0f172a;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
.topo{background:#0f172a;color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;position:sticky;top:0;z-index:5}
.topo-l{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.topo img{width:32px;height:32px;border-radius:8px}
.topo h1{font-size:17px;margin:0;flex:1}
.topo h1 small{display:block;font-size:12px;font-weight:500;color:#94a3b8}
.amb{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;letter-spacing:.3px}
.amb.teste{background:#f59e0b;color:#111}.amb.prod{background:#16a34a;color:#fff}
.sair{background:transparent;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:7px 12px;cursor:pointer}
.abas{display:flex;gap:4px;overflow-x:auto;max-width:1100px;margin:12px auto 0;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{background:transparent;border:0;color:#94a3b8;font-weight:700;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.abas button.on{color:#fff;border-bottom-color:#60a5fa}
main{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.card h2{font-size:15px;margin:0 0 10px}
.nota{font-size:13px;color:#475569;line-height:1.5;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:#64748b;font-weight:600}
.kpi.verde b{color:#16a34a}.kpi.amarelo b{color:#b45309}.kpi.vermelho b{color:#dc2626}.kpi.azul b{color:#1d4ed8}
.linha{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f1f5f9}
.linha:first-child{border-top:0}
.linha .info{flex:1;min-width:0}
.linha .t{font-weight:700;font-size:14.5px;word-break:break-word}
.linha .s{font-size:12.5px;color:#64748b;line-height:1.5;margin-top:2px;word-break:break-word}
.linha .t + .selo{margin:4px 0 2px}
body.teste .topo{padding-top:calc(env(safe-area-inset-top) + 34px)}
.selo{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.s-livre{background:#e0e7ff;color:#3730a3}.s-teste{background:#fef3c7;color:#92400e}.s-pago{background:#dcfce7;color:#166534}
.s-cortesia{background:#f3e8ff;color:#6b21a8}.s-vencida{background:#fee2e2;color:#991b1b}.s-suspensa{background:#1f2937;color:#fff}
.s-vence{background:#ffedd5;color:#9a3412}
.btn{border:1.5px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:40px}
.btn.pri{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn.perigo{border-color:#fecaca;color:#b91c1c;background:#fff}
.btn.perigo.on{background:#b91c1c;color:#fff}
.btn:disabled{opacity:.5}
.btn.cheio{width:100%}
.grupo-btn{display:flex;gap:8px;flex-wrap:wrap}
input.in,select.in,textarea.in{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;color:#0f172a}
textarea.in{min-height:90px;resize:vertical}
label.lb{display:block;font-size:12.5px;font-weight:800;color:#475569;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.3px}
.erro{color:#b91c1c;font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
.codigo{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;background:#f1f5f9;border-radius:10px;padding:12px;text-align:center;letter-spacing:.5px;word-break:break-all}
.busca{margin-bottom:10px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filtros button{border:1.5px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.filtros button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.vazio{color:#94a3b8;font-size:13.5px;padding:10px 0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.barra{display:flex;align-items:center;gap:8px;margin:4px 0}
.barra i{display:block;height:8px;border-radius:4px;background:#60a5fa}
.barra span{font-size:12.5px;color:#475569;min-width:90px}
/* login */
.login{max-width:380px;margin:12vh auto 0;padding:0 18px}
.login img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 12px}
.login h1{text-align:center;font-size:20px;margin:0 0 4px}
.login p{text-align:center;color:#64748b;font-size:13.5px;margin:0 0 18px}
/* folha */
.fundo{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.fundo.on{display:flex}
.folha{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
@media (min-width:700px){.fundo{align-items:center}.folha{border-radius:20px}}
.folha h3{margin:0 0 4px;font-size:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;display:none;max-width:90vw}
.carregando{text-align:center;color:#64748b;padding:40px 0}
</style>
</head>
<body>

<div id="v-login" class="login" style="display:none">
  <img src="../icon.svg?v=2" alt="">
  <h1>Administração</h1>
  <p>MinhaCasa™ · área restrita</p>
  <div class="card">
    <label class="lb" for="l-email">E-mail</label>
    <input class="in" id="l-email" type="email" autocomplete="username">
    <label class="lb" for="l-senha">Senha</label>
    <input class="in" id="l-senha" type="password" autocomplete="current-password">
    <div class="erro" id="l-erro"></div>
    <button class="btn cheio" id="l-entrar">Entrar com e-mail e senha</button>
  </div>
  <div class="card">
    <p class="nota" style="margin:0 0 10px">Administrador com conta Google: a verificação em duas etapas é a do próprio Google.</p>
    <button class="btn pri cheio" id="l-google">Entrar com o Google</button>
    <div class="erro" id="l-gerro"></div>
  </div>
</div>

<div id="v-negado" class="login" style="display:none">
  <img src="../icon.svg?v=2" alt="">
  <h1>Sem acesso</h1>
  <p id="n-msg">Esta conta não é de administrador.</p>
  <button class="btn cheio" id="n-sair">Sair e entrar com outra conta</button>
</div>

<div id="v-painel" style="display:none">
  <div class="topo">
    <div class="topo-l">
      <img src="../icon.svg?v=2" alt="">
      <h1>Administração<small id="p-quem"></small></h1>
      <span class="amb" id="p-amb"></span>
      <button class="sair" id="p-sair">Sair</button>
    </div>
    <nav class="abas" id="abas">
      <button data-aba="geral" class="on">📊 Visão geral</button>
      <button data-aba="casas">🏠 Casas e assinaturas</button>
      <button data-aba="contas">👤 Contas</button>
      <button data-aba="convites">✉️ Convites</button>
      <button data-aba="aviso">📣 Aviso</button>
      <button data-aba="seg">🔐 Segurança</button>
    </nav>
  </div>
  <main id="conteudo"><div class="carregando">Carregando…</div></main>
</div>

<div class="fundo" id="fundo"><div class="folha" id="folha"></div></div>
<div class="toast" id="toast"></div>

<script src="../config.js"></script>
<script type="module">
// 23/11/2026: SDK modular (a verificação em duas etapas por código, TOTP, só existe nele)
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, getMultiFactorResolver, TotpMultiFactorGenerator, TotpSecret,
  multiFactor, EmailAuthProvider, reauthenticateWithCredential, updatePassword, verifyBeforeUpdateEmail, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref as dbRef, get as dbGet, set as dbSet, remove as dbRemove, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
window.__FB = { initializeApp, getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, getMultiFactorResolver, TotpMultiFactorGenerator, TotpSecret,
  multiFactor, EmailAuthProvider, reauthenticateWithCredential, updatePassword, verifyBeforeUpdateEmail, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, getDatabase, dbRef, dbGet, dbSet, dbRemove, serverTimestamp };

// ═══════════════════════════════════════════════════════════════════
// MinhaCasa™ — painel do administrador (23/11/2026)
// Página separada do app. Quem pode ler e gravar é decidido nas regras do Firebase
// (database.rules.json): esconder esta página não é a proteção, o servidor recusa quem não é admin.
// Os lançamentos das famílias são criptografados no aparelho delas: este painel NÃO lê nem consegue ler.
// Ele vê só: e-mails, último acesso, versão do app, casas, convites, assinaturas e o aviso geral.
// ═══════════════════════════════════════════════════════════════════
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var qsa = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var DIA = 86400000;
  var PLANOS = { teste: 'Período de teste', mensal: 'Mensal', anual: 'Anual', cortesia: 'Cortesia' };

  var F = window.__FB;
  var app = F.initializeApp(window.HOMEVAULT_FIREBASE), A = F.getAuth(app), DB = F.getDatabase(app);
  A.languageCode = 'pt-BR';
  var TS = F.serverTimestamp();
  // mesmo jeito de usar do SDK antigo (db.ref(caminho).once/set/remove), para o resto do painel não mudar
  var db = { ref: function (p) { var r = F.dbRef(DB, p); return {
    once: function () { return F.dbGet(r).then(function (s) { return { val: function () { return s.val(); } }; }); },
    set: function (v) { return F.dbSet(r, v); }, remove: function () { return F.dbRemove(r); } }; } };

  var D = { codigo: '', convites: {}, contas: {}, usuarios: {}, assin: {}, aviso: null, casas: {} };
  var UI = { aba: 'geral', busca: '', filtro: 'todas', confirmar: null };

  if (window.MINHACASA_AMBIENTE !== 'producao') document.body.classList.add('teste');
  $('p-amb').textContent = window.MINHACASA_AMBIENTE === 'producao' ? 'PRODUÇÃO' : 'TESTE';
  $('p-amb').className = 'amb ' + (window.MINHACASA_AMBIENTE === 'producao' ? 'prod' : 'teste');

  function toast(t) { var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { el.style.display = 'none'; }, 3500); }
  function mostrar(v) { ['v-login', 'v-negado', 'v-painel'].forEach(function (x) { $(x).style.display = x === v ? '' : 'none'; }); }
  function dataBR(ts) { if (!ts) return '—'; var d = new Date(ts); return d.toLocaleDateString('pt-BR'); }
  function dataHora(ts) { if (!ts) return '—'; var d = new Date(ts); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  function haQuanto(ts) {
    if (!ts) return 'nunca';
    var m = Math.round((Date.now() - ts) / 60000);
    if (m < 2) return 'agora'; if (m < 60) return 'há ' + m + ' min';
    var h = Math.round(m / 60); if (h < 24) return 'há ' + h + ' h';
    var d = Math.round(h / 24); return d === 1 ? 'ontem' : 'há ' + d + ' dias';
  }
  function fimDoDia(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 23, 59, 59).getTime(); }
  function isoDe(ts) { var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function erroTxt(e) { var c = (e && e.code) || String(e); return /PERMISSION/i.test(c) ? 'o Firebase recusou (as regras novas já foram publicadas?)' : c; }
  var CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function aleatorio(n) { var r = crypto.getRandomValues(new Uint8Array(n)), t = ''; for (var i = 0; i < n; i++) t += CHARS[r[i] % CHARS.length]; return t; }
  function copiar(t) {
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('📋 Copiado'); }, function () { window.prompt('Copie:', t); });
  }

  // ── login ──
  $('l-entrar').onclick = function () {
    var em = $('l-email').value.trim(), se = $('l-senha').value, er = $('l-erro'); er.textContent = '';
    if (!em || !se) { er.textContent = 'Digite e-mail e senha.'; return; }
    $('l-entrar').disabled = true;
    F.signInWithEmailAndPassword(A, em, se).catch(function (e) {
      if (e && e.code === 'auth/multi-factor-auth-required') return segundaEtapa(e, er);
      er.textContent = /wrong-password|invalid-credential|user-not-found|invalid-login/i.test(e.code || '') ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar (' + (e.code || e) + ').';
    }).then(function () { $('l-entrar').disabled = false; });
  };
  $('l-senha').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('l-entrar').click(); });
  function provGoogle() { var p = new F.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); return p; }
  function erroGoogle(e) {
    var c = (e && e.code) || String(e);
    if (/popup-closed|cancelled-popup/.test(c)) return '';
    if (/popup-blocked/.test(c)) return 'O navegador bloqueou a janela do Google. Permita janelas (pop-ups) para este site e tente de novo.';
    if (/operation-not-allowed/.test(c)) return 'O login com Google ainda não foi ligado no Firebase (Authentication → Método de login → Google).';
    if (/unauthorized-domain/.test(c)) return 'Este endereço não está autorizado no Firebase (Authentication → Configurações → Domínios autorizados).';
    return 'Não foi possível entrar com o Google (' + c + ').';
  }
  $('l-google').onclick = function () {
    $('l-gerro').textContent = '';
    F.signInWithPopup(A, provGoogle()).catch(function (e) { $('l-gerro').textContent = erroGoogle(e); });
  };
  $('p-sair').onclick = $('n-sair').onclick = function () { F.signOut(A); };

  // Pede o código de 6 dígitos do app autenticador. Devolve uma promessa com o código (ou rejeita se cancelar).
  function pedirCodigo(titulo) {
    return new Promise(function (ok, nao) {
      $('folha').innerHTML = '<h3>🔐 ' + esc(titulo || 'Código do autenticador') + '</h3><p class="nota">Abra o app autenticador (Senhas do iPhone, Google Authenticator…) e digite o código de 6 dígitos de <b>MinhaCasa</b>.</p>' +
        '<input class="in" id="mf-cod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size:24px;letter-spacing:6px;text-align:center">' +
        '<div class="erro" id="mf-erro"></div><div class="grupo-btn"><button class="btn pri" id="mf-ok" style="flex:1">Confirmar</button><button class="btn" id="mf-cancelar">Cancelar</button></div>';
      $('fundo').classList.add('on'); setTimeout(function () { $('mf-cod').focus(); }, 50);
      var envia = function () { var c = $('mf-cod').value.replace(/\D/g, ''); if (c.length !== 6) { $('mf-erro').textContent = 'São 6 números.'; return; } fecharFolha(); ok(c); };
      $('mf-ok').onclick = envia; $('mf-cod').addEventListener('keydown', function (e) { if (e.key === 'Enter') envia(); });
      $('mf-cancelar').onclick = function () { fecharFolha(); nao({ code: 'cancelado' }); };
    });
  }
  // A conta tem verificação em duas etapas: resolve com o código (até 3 tentativas)
  function resolverMFA(erro, tentativa) {
    var res = F.getMultiFactorResolver(A, erro), dica = res.hints.filter(function (h) { return h.factorId === 'totp'; })[0];
    if (!dica) return Promise.reject({ code: 'sem-totp' });
    return pedirCodigo(tentativa ? 'Código errado, tente de novo' : 'Código do autenticador').then(function (c) {
      return res.resolveSignIn(F.TotpMultiFactorGenerator.assertionForSignIn(dica.uid, c)).catch(function (e) {
        if (/invalid-verification-code|code/i.test(e.code || '') && (tentativa || 0) < 2) return resolverMFA(erro, (tentativa || 0) + 1);
        throw e;
      });
    });
  }
  function segundaEtapa(e, er) {
    return resolverMFA(e).catch(function (x) { if (x.code !== 'cancelado') er.textContent = 'Não foi possível confirmar o código (' + (x.code || x) + ').'; });
  }

  F.onAuthStateChanged(A, function (u) {
    if (!u) { mostrar('v-login'); return; }
    // é admin? Só o admin consegue ler admin/codigoAcesso.
    db.ref('admin/codigoAcesso').once().then(function (s) {
      D.codigo = s.val() || '';
      $('p-quem').textContent = u.email || '';
      mostrar('v-painel');
      carregar();
    }, function () {
      var pv = (u.providerData || []).map(function (p) { return p.providerId; }).join(', ');
      $('n-msg').innerHTML = 'A conta ' + esc(u.email || '') + ' não é de administrador.<br><small style="color:#94a3b8">código ' + esc(u.uid.slice(0, 10)) + ' · entrou por ' + esc(pv || '?') + '</small>';
      mostrar('v-negado');
    });
  });

  // ── dados ──
  function ler(ref) { return db.ref(ref).once().then(function (s) { return s.val() || {}; }, function (e) { console.warn(ref, e); return null; }); }
  function carregar() {
    $('conteudo').innerHTML = '<div class="carregando">Carregando…</div>';
    return Promise.all([ler('convites'), ler('contas'), ler('usuarios'), ler('assinaturas'), ler('aviso'), ler('admin/codigoAcesso'), ler('admins'), db.ref('admin/legadoOff').once().then(function (s) { return s.val(); }, function () { return null; })]).then(function (r) {
      D.admins = r[6]; D.legadoOff = r[7] === true;
      D.convites = r[0] || {}; D.contas = r[1] || {}; D.usuarios = r[2]; D.assin = r[3] || {}; D.aviso = r[4] && r[4].texto ? r[4] : null;
      D.semRegras = r[2] === null || r[3] === null;
      D.codigo = typeof r[5] === 'string' ? r[5] : (r[5] && typeof r[5] === 'object' && !Object.keys(r[5]).length ? '' : D.codigo);
      montarCasas();
      return Promise.all(Object.keys(D.casas).map(function (id) {
        return Promise.all([db.ref('casas/' + id + '/dono').once(), db.ref('casas/' + id + '/criada').once()]).then(function (x) {
          D.casas[id].dono = x[0].val(); D.casas[id].criada = x[1].val();
        }, function () {});
      }));
    }).then(render);
  }
  // casa ← usuarios/<uid>/casa (todos, desde o início) e contas/<uid>/casa (gravado pela versão nova)
  function montarCasas() {
    var c = {};
    var add = function (id, uid) { if (!id) return; var x = c[id] || (c[id] = { id: id, membros: [] }); if (uid && x.membros.indexOf(uid) < 0) x.membros.push(uid); };
    Object.keys(D.usuarios || {}).forEach(function (uid) { add((D.usuarios[uid] || {}).casa, uid); });
    Object.keys(D.contas).forEach(function (uid) { if (!(D.usuarios || {})[uid]) add(D.contas[uid].casa, uid); });
    Object.keys(D.assin).forEach(function (id) { add(id); });
    D.casas = c;
  }
  function casaDe(uid) { var u = (D.usuarios || {})[uid]; return (u && u.casa) || (D.contas[uid] || {}).casa || null; }
  function emailDe(uid) { var c = D.contas[uid]; if (c && c.email) return c.email; var cv = Object.keys(D.convites).filter(function (k) { return D.convites[k].usadoPor === uid; })[0]; return cv ? D.convites[cv].email || '' : ''; }
  function nomeDe(uid) { var cv = Object.keys(D.convites).filter(function (k) { return D.convites[k].usadoPor === uid; })[0]; return cv ? D.convites[cv].nome : ''; }
  function ultimoCasa(x) { return x.membros.reduce(function (m, uid) { return Math.max(m, (D.contas[uid] || {}).ultimo || 0); }, 0); }

  // situação da assinatura de uma casa
  function situacao(id) {
    var a = D.assin[id];
    if (!a) return { k: 'livre', txt: 'Fase de testes (livre)', cls: 's-livre' };
    if (a.bloqueada) return { k: 'suspensa', txt: 'Suspensa · só consulta', cls: 's-suspensa' };
    if (typeof a.vence === 'number') {

      // cria numa instância separada, para não tirar você do painel
      var app2 = F.initializeApp(window.HOMEVAULT_FIREBASE, 'novoAdmin' + Date.now()), A2 = F.getAuth(app2);
      F.createUserWithEmailAndPassword(A2, em, s1).then(function (c) {
        var uid = c.user.uid; F.signOut(A2);
        return db.ref('admins/' + uid).set(true);
      }).then(function () { toast('✅ Conta de administrador criada. Agora toque em Sair e entre com ela.'); return carregar(); },
        function (e) { er.textContent = msgErro(e); nc.disabled = false; });
    };
    var ml = $('mf-ligar');
    if (ml) ml.onclick = function () {
      var er = $('mf-erro2'); er.textContent = ''; ml.disabled = true;
      var segredo;
      F.multiFactor(eu()).getSession().then(function (ses) { return F.TotpMultiFactorGenerator.generateSecret(ses); }).then(function (sec) {
        segredo = sec;
        var url = sec.generateQrCodeUrl(eu().email, 'MinhaCasa Admin');
        $('folha').innerHTML = '<h3>🔐 Ligar a verificação em duas etapas</h3>' +
          '<p class="nota"><b>No iPhone:</b> toque no botão abaixo. Ele abre o app <b>Senhas</b> (ou o seu autenticador) para guardar o código do MinhaCasa.</p>' +
          '<a class="btn pri cheio" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="' + esc(url) + '">Adicionar ao autenticador</a>' +
          '<p class="nota"><b>No computador ou se o botão não funcionar:</b> no autenticador, escolha "digitar chave" e use esta chave:</p>' +
          '<div class="codigo" style="font-size:15px">' + esc(sec.secretKey.replace(/(.{4})/g, '$1 ').trim()) + '</div>' +
          '<div class="grupo-btn" style="margin:8px 0 4px"><button class="btn" id="mf-copiar">Copiar a chave</button></div>' +
          '<label class="lb" for="mf-cod1">Código de 6 dígitos que apareceu</label><input class="in" id="mf-cod1" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size:24px;letter-spacing:6px;text-align:center">' +
          '<div class="erro" id="mf-erro3"></div><div class="grupo-btn"><button class="btn pri" id="mf-confirmar" style="flex:1">Confirmar e ligar</button><button class="btn" id="mf-fechar">Cancelar</button></div>' +
          '<p class="nota" style="margin-top:10px">⚠️ Guarde a chave num lugar seguro. Se perder o celular, é com ela que você recupera os códigos.</p>';
        $('fundo').classList.add('on');
        $('mf-copiar').onclick = function () { copiar(sec.secretKey); };
        $('mf-fechar').onclick = function () { fecharFolha(); ml.disabled = false; };
        $('mf-confirmar').onclick = function () {
          var c = $('mf-cod1').value.replace(/\D/g, ''); if (c.length !== 6) { $('mf-erro3').textContent = 'São 6 números.'; return; }
          $('mf-confirmar').disabled = true;
          F.multiFactor(eu()).enroll(F.TotpMultiFactorGenerator.assertionForEnrollment(segredo, c), 'Autenticador').then(function () {
            fecharFolha(); toast('✅ Verificação em duas etapas ligada.'); render();
          }, function (e) { $('mf-confirmar').disabled = false; $('mf-erro3').textContent = /invalid-verification-code|code/.test(e.code || '') ? 'Código errado. Confira a hora do celular e tente o código novo.' : msgErro(e); });
        };
      }, function (e) {
        ml.disabled = false;
        er.textContent = /requires-recent-login/.test(e.code || '') ? 'Por segurança, toque em Sair, entre de novo e tente outra vez.' : msgErro(e);
      });
    };
    var lg = $('lg-tirar');
    if (lg) lg.onclick = function () { confirmarDepois('_legado', function () { return db.ref('admin/legadoOff').set(true).then(function () { toast('✅ A conta da casa não entra mais no painel.'); }); }); };
    qsa('[data-admrem]').forEach(function (b) { b.onclick = function () { var uid = b.dataset.admrem; confirmarDepois('adm:' + uid, function () { return db.ref('admins/' + uid).remove(); }); }; });
    var ms = $('mc-salvar');
    if (ms) ms.onclick = function () {
      var atual = $('mc-atual').value, em = $('mc-email').value.trim(), s1 = $('mc-senha').value, s2 = $('mc-senha2').value, er = $('mc-erro'); er.textContent = '';
      if (!atual) { er.textContent = 'Digite a senha atual.'; return; }
      if (!em && !s1) { er.textContent = 'Preencha o e-mail novo ou a senha nova.'; return; }
      if (s1 && s1.length < (souDaLista() ? 12 : 8)) { er.textContent = 'A senha nova precisa de pelo menos ' + (souDaLista() ? 12 : 8) + ' caracteres.'; return; }
      if (s1 !== s2) { er.textContent = 'As senhas novas não são iguais.'; return; }
      ms.disabled = true;
      confirmarSenha(atual).then(function () {
        return s1 ? F.updatePassword(eu(), s1) : null;
      }).then(function () {
        return em ? F.verifyBeforeUpdateEmail(eu(), em) : null;
      }).then(function () {
        ms.disabled = false; $('mc-atual').value = $('mc-senha').value = $('mc-senha2').value = '';
        toast((s1 ? '✅ Senha trocada. ' : '') + (em ? '📧 Enviamos um link para ' + em + '. O e-mail muda quando você tocar nele.' : ''));
      }, function (e) { ms.disabled = false; if (e.code !== 'cancelado') er.textContent = msgErro(e); });
    };
  }

  // ── ações ──
  function confirmarDepois(chave, acao) {
    if (UI.confirmar !== chave) { UI.confirmar = chave; render(); setTimeout(function () { if (UI.confirmar === chave) { UI.confirmar = null; render(); } }, 5000); return; }
    UI.confirmar = null;
    acao().then(function () { return carregar(); }, function (e) { toast('⚠️ Não foi possível: ' + erroTxt(e)); render(); });
  }
  function ligar() {
    if (UI.aba === 'seg') ligarSeg();
    var b = $('busca'); if (b) b.oninput = function () { UI.busca = b.value; var p = b.selectionStart; render(); var n = $('busca'); n.focus(); n.setSelectionRange(p, p); };
    qsa('[data-filtro]').forEach(function (x) { x.onclick = function () { UI.filtro = x.dataset.filtro; if (x.dataset.ir) { UI.aba = x.dataset.ir; qsa('#abas button').forEach(function (z) { z.classList.toggle('on', z.dataset.aba === UI.aba); }); } render(); }; });
    qsa('[data-casa]').forEach(function (x) { x.onclick = function () { abrirCasa(x.dataset.casa); }; });
    // convites
    var cc = $('cv-criar');
    if (cc) {
      cc.onclick = function () {
        var nome = $('cv-nome').value.trim(), er = $('cv-erro'); er.textContent = '';
        if (!nome) { er.textContent = 'Digite o nome da pessoa.'; return; }
        var base = nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) || 'PESSOA';
        var cod = 'CASA-' + base + '-' + aleatorio(5); cc.disabled = true;
        db.ref('convites/' + cod).set({ nome: nome, criado: TS }).then(function () { toast('✅ Convite criado para ' + nome + '. Toque em Enviar.'); return carregar(); },
          function (e) { er.textContent = 'Não foi possível criar o convite: ' + erroTxt(e); cc.disabled = false; });
      };
      qsa('[data-cvenviar]').forEach(function (x) { x.onclick = function () {
        var cod = x.dataset.cvenviar, nome = D.convites[cod].nome, app = location.origin + '/';
        var txt = '🏠 Olá, ' + nome + '! Você foi convidado para testar o MinhaCasa™.\n\n1. Abra: ' + app + '\n2. Crie sua conta (e-mail e senha)\n3. Em "Criar casa", use o seu código pessoal: ' + cod + '\n\nEste código é só seu e vale uma vez.';
        if (navigator.share) navigator.share({ text: txt }).catch(function () {}); else copiar(txt);
      }; });
      qsa('[data-cvcancelar]').forEach(function (x) { x.onclick = function () { var cod = x.dataset.cvcancelar; confirmarDepois(cod, function () { return db.ref('convites/' + cod + '/cancelado').set(true); }); }; });
      qsa('[data-cvapagar]').forEach(function (x) { x.onclick = function () { var cod = x.dataset.cvapagar; confirmarDepois(cod, function () { return db.ref('convites/' + cod).remove(); }); }; });
      $('cg-copiar').onclick = function () { if (D.codigo) copiar(D.codigo); };
      $('cg-trocar').onclick = function () { confirmarDepois('_trocar', function () { var c = 'CASA-' + aleatorio(4) + '-' + aleatorio(4); return db.ref('admin/codigoAcesso').set(c).then(function () { D.codigo = c; toast('🔑 Código geral novo: ' + c); }); }); };
      $('cg-desativar').onclick = function () { if (!D.codigo) return; confirmarDepois('_desativar', function () { return db.ref('admin/codigoAcesso').remove().then(function () { D.codigo = ''; toast('⛔ Código geral desativado.'); }); }); };
    }
    // aviso
    var ap = $('av-publicar');
    if (ap) {
      ap.onclick = function () {
        var t = $('av-texto').value.trim(), er = $('av-erro'); er.textContent = '';
        if (!t) { er.textContent = 'Escreva o texto do aviso.'; return; }
        ap.disabled = true;
        db.ref('aviso').set({ texto: t, tipo: $('av-tipo').value, id: Date.now() }).then(function () { toast('📣 Aviso publicado para todos.'); return carregar(); },
          function (e) { er.textContent = 'Não foi possível publicar: ' + erroTxt(e); ap.disabled = false; });
      };
      var at = $('av-tirar'); if (at) at.onclick = function () { confirmarDepois('_aviso', function () { return db.ref('aviso').remove().then(function () { toast('Aviso retirado.'); }); }); };
    }
  }

  // ── folha da casa: assinatura ──
  function fecharFolha() { $('fundo').classList.remove('on'); }
  $('fundo').onclick = function (e) { if (e.target === $('fundo')) fecharFolha(); };
  function abrirCasa(id) {
    var x = D.casas[id], a = D.assin[id] || {}, s = situacao(id);
    var pessoas = x.membros.map(function (u) { var n = nomeDe(u); return '<div class="s">' + (x.dono === u ? '👑 ' : '👥 ') + esc(n ? n + ' · ' : '') + esc(emailDe(u) || u) + ' · ' + haQuanto((D.contas[u] || {}).ultimo) + '</div>'; }).join('');
    $('folha').innerHTML = '<h3>🏠 ' + esc(emailDe(x.dono) || 'Casa') + '</h3>' +
      '<div class="s" style="font-size:12.5px;color:#64748b">Código interno <span class="mono">' + esc(id) + '</span> · criada ' + dataBR(x.criada) + '</div>' +
      '<div style="margin:10px 0">' + pessoas + '</div>' +
      '<div><span class="selo ' + s.cls + '">' + esc(s.txt) + '</span></div>' +
      '<label class="lb" for="as-plano">Plano</label><select class="in" id="as-plano">' +
      Object.keys(PLANOS).map(function (k) { return '<option value="' + k + '"' + (a.plano === k ? ' selected' : '') + '>' + PLANOS[k] + '</option>'; }).join('') + '</select>' +
      '<label class="lb" for="as-vence">Vence em</label><input class="in" type="date" id="as-vence" value="' + (typeof a.vence === 'number' ? isoDe(a.vence) : '') + '">' +
      '<div class="grupo-btn" style="margin-top:8px"><button class="btn" data-mais="7">+7 dias</button><button class="btn" data-mais="30">+30 dias</button><button class="btn" data-mais="365">+1 ano</button><button class="btn" data-mais="0">Sem vencimento</button></div>' +
      '<p class="nota" style="margin-top:8px">Os botões somam a partir do vencimento atual (ou de hoje, se já venceu). Vence no fim do dia escolhido.</p>' +
      '<label class="lb"><input type="checkbox" id="as-bloq"' + (a.bloqueada ? ' checked' : '') + ' style="width:18px;height:18px;vertical-align:middle;margin-right:6px">Suspender (só consulta)</label>' +
      '<label class="lb" for="as-obs">Observação (só você vê)</label><input class="in" id="as-obs" maxlength="300" value="' + esc(a.obs || '') + '" placeholder="Ex.: pagou por PIX em 23/11">' +
      '<div class="erro" id="as-erro"></div>' +
      '<div class="grupo-btn"><button class="btn pri" id="as-salvar" style="flex:1">Salvar</button><button class="btn" id="as-fechar">Fechar</button></div>' +
      (D.assin[id] ? '<button class="btn perigo cheio" id="as-remover" style="margin-top:10px">Tirar assinatura (volta para fase de testes livre)</button>' : '');
    $('fundo').classList.add('on');
    $('as-fechar').onclick = fecharFolha;
    qsa('[data-mais]').forEach(function (b) { b.onclick = function () {
      var n = +b.dataset.mais, v = $('as-vence');
      if (!n) { v.value = ''; return; }
      var base = v.value ? fimDoDia(v.value) : 0; if (base < Date.now()) base = Date.now();
      v.value = isoDe(base + n * DIA);
    }; });
    $('as-salvar').onclick = function () {
      var er = $('as-erro'), plano = $('as-plano').value, ven = $('as-vence').value, obs = $('as-obs').value.trim(); er.textContent = '';
      if ((plano === 'teste' || plano === 'mensal' || plano === 'anual') && !ven) { er.textContent = 'Escolha a data de vencimento (ou use o plano Cortesia).'; return; }
      var reg = { plano: plano, atualizado: TS };
      if (ven) reg.vence = fimDoDia(ven);
      if ($('as-bloq').checked) reg.bloqueada = true;
      if (obs) reg.obs = obs;
      $('as-salvar').disabled = true;
      db.ref('assinaturas/' + id).set(reg).then(function () { fecharFolha(); toast('✅ Assinatura salva.'); return carregar(); },
        function (e) { er.textContent = 'Não foi possível salvar: ' + erroTxt(e); $('as-salvar').disabled = false; });
    };
    var rm = $('as-remover');
    if (rm) rm.onclick = function () {
      if (rm.dataset.ok !== '1') { rm.dataset.ok = '1'; rm.textContent = 'Toque de novo para confirmar'; rm.classList.add('on'); return; }
      db.ref('assinaturas/' + id).remove().then(function () { fecharFolha(); toast('Assinatura retirada.'); return carregar(); }, function (e) { $('as-erro').textContent = erroTxt(e); });
    };
  }
})();
</script>
</body>
</html>
